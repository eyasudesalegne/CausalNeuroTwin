[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "causalneurotwin"
version = "0.2.0a1"
description = "Repository foundation for physics-informed NeuroAI brain-stimulation research."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
  {name = "Eyasu Desalegne Beyene", email = "e.beyene@ogr.iuc.edu.tr"}
]
keywords = [
  "neuroai",
  "computational-neuroscience",
  "brain-stimulation",
  "research-software",
  "high-performance-computing"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
scientific = [
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "nibabel>=5.2,<6",
  "matplotlib>=3.8,<4"
]
tvb = ["tvb-library==2.10.0", "numba>=0.60,<1"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "setuptools>=77",
  "packaging>=24.2",
  "types-PyYAML>=6,<7"
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10"
]

[project.scripts]
causalneurotwin = "causalneurotwin.cli:main"

[project.urls]
Homepage = "https://github.com/eyasudesalegne/CausalNeuroTwin"
Repository = "https://github.com/eyasudesalegne/CausalNeuroTwin"
Issues = "https://github.com/eyasudesalegne/CausalNeuroTwin/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "build: package-build validation",
  "integration: tests crossing module boundaries",
  "allocated: requires separately authorized scientific runtime on a compute node"
]

[tool.coverage.run]
branch = true
source = ["causalneurotwin"]
omit = ["*/__main__.py", "*/validation/*"] # Foundation coverage; scientific scope is separate

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

# Migrated dynamic numerical kernels are tested separately; foundation typing stays strict.
[[tool.mypy.overrides]]
module = ["causalneurotwin.validation.*"]
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
"src/causalneurotwin/validation/**/*.py" = ["E501", "E731", "E741", "B905", "RUF005"]
"tests/scientific/**/*.py" = ["E501", "E731", "E741", "B905", "RUF005"]
